<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Litre — Privacy Policy / Gizlilik Politikası</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="alternate" hreflang="en" href="https://nodabasi.github.io/litre-app/en/privacy/">
<link rel="alternate" hreflang="tr" href="https://nodabasi.github.io/litre-app/privacy/">
<script>
  // The app and the store listings link here with one URL for both languages,
  // so send each reader to the policy in theirs.
  var lang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
  location.replace(/^tr\b/i.test(lang) ? 'privacy/' : 'en/privacy/');
</script>
</head>
<body>
<div class="wrap">

<header>
  <img src="assets/logo.png" alt="Litre">
  <h1>Privacy Policy</h1>
  <p class="tagline">Gizlilik Politikası</p>
</header>

<ul class="plain">
  <li><a href="en/privacy/">English</a></li>
  <li><a href="privacy/">Türkçe</a></li>
</ul>

</div>
</body>
</html>
